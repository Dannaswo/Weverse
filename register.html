<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weverse Account - Sign Up</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='register.css') }}">
</head>
<body>

  <div class="signup-container">
    <!-- Flecha para volver al login o inicio -->
    <a href="/login" class="back-btn" aria-label="Volver">&#8249;</a>

    <div class="signup-header">
      <span class="logo-weverse">weverse</span><span class="logo-account"> account</span>
    </div>

    <h1>Sign Up</h1>

    <form action="/registro" method="POST" id="signupForm">
      
      <!-- Campo Email -->
      <div class="form-group">
        <label for="email">Email *</label>
        <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required autocomplete="email">
      </div>

      <!-- Campo Password -->
      <div class="form-group">
        <label for="password">Password *</label>
        <div class="input-with-icon">
          <input type="password" id="password" name="password" class="form-input" placeholder="Enter Password" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/Ocultar">👁️</button>
        </div>
        <span class="input-hint">8–32 characters, including letters, numbers, and special characters</span>
      </div>

      <!-- Campo Confirmar Password -->
      <div class="form-group">
        <label for="confirm_password">Confirm Password *</label>
        <div class="input-with-icon">
          <input type="password" id="confirm_password" name="confirm_password" class="form-input" placeholder="Enter Password" required autocomplete="new-password">
          <button type="button" class="toggle-password" id="toggleConfirm" title="Mostrar/Ocultar">👁️</button>
        </div>
        <span class="input-hint" id="matchHint"></span>
      </div>

      <!-- Campo Username -->
      <div class="form-group">
        <label for="username">Username *</label>
        <input type="text" id="username" name="username" class="form-input" value="Member_yxvhs7" required>
        <span class="input-hint">Choose your username. You can change it later in Account Settings. (1 - 32 characters, numbers, and special characters allowed)</span>
      </div>

      <!-- Botón de Siguiente / Registrarse -->
      <button type="submit" id="submitBtn" class="submit-btn" disabled>Next</button>
    </form>

    <div class="login-redirect">
      Already have an account? <a href="/login">Log In</a>
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmInput = document.getElementById('confirm_password');
    const submitBtn = document.getElementById('submitBtn');
    const matchHint = document.getElementById('matchHint');

    function validateForm() {
      const email = emailInput.value.trim();
      const pass = passwordInput.value;
      const confirmPass = confirmInput.value;

      let isValid = true;

      // Validar contraseñas iguales
      if (pass && confirmPass) {
        if (pass === confirmPass) {
          matchHint.textContent = "Password confirmed.";
          matchHint.style.color = "#00c7ae";
        } else {
          matchHint.textContent = "Passwords do not match.";
          matchHint.style.color = "#ff4d4d";
          isValid = false;
        }
      } else {
        matchHint.textContent = "";
      }

      if (email === "" || pass === "" || confirmPass === "" || pass !== confirmPass) {
        isValid = false;
      }

      if (isValid) {
        submitBtn.classList.add('active');
        submitBtn.removeAttribute('disabled');
      } else {
        submitBtn.classList.remove('active');
        submitBtn.setAttribute('disabled', 'true');
      }
    }

    emailInput.addEventListener('input', validateForm);
    passwordInput.addEventListener('input', validateForm);
    confirmInput.addEventListener('input', validateForm);

    // Mostrar/Ocultar contraseñas
    document.getElementById('togglePassword').addEventListener('click', function() {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
    });

    document.getElementById('toggleConfirm').addEventListener('click', function() {
      const type = confirmInput.getAttribute('type') === 'password' ? 'text' : 'password';
      confirmInput.setAttribute('type', type);
    });
  </script>

</body>
</html>

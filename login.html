<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weverse Account - Log In</title>
  <!-- Enlace al archivo CSS separado en Flask -->
  <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>
<body>

  <div class="login-container">
    <!-- Flecha para volver a la tienda -->
    <a href="/" class="back-btn" aria-label="Volver">&#8249;</a>

    <div class="login-header">
      <span class="logo-weverse">weverse</span><span class="logo-account"> account</span>
    </div>

    <h1>Log In</h1>

    <form action="/login" method="POST" id="loginForm">
      <div class="form-group">
        <input type="email" id="email" name="email" class="form-input" placeholder="your@email.com" required autocomplete="email">
      </div>

      <div class="form-group password-container">
        <input type="password" id="password" name="password" class="form-input" placeholder="Password" required autocomplete="current-password">
        <button type="button" class="toggle-password" id="togglePassword" title="Mostrar/Ocultar contraseña">
          <!-- Icono de ojo SVG limpio -->
          <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
            <line x1="1" y1="1" x2="23" y2="23"></line>
          </svg>
        </button>
      </div>

      <a href="#" class="reset-link">Reset your password</a>

      <button type="submit" id="submitBtn" class="submit-btn" disabled>Log In</button>
    </form>

    <div class="help-text">
      Having trouble logging in? <a href="#">Learn more</a>
    </div>

    <div class="signup-container">
      New to Weverse? <a href="/registro">Sign Up</a>
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const togglePassword = document.getElementById('togglePassword');

    // Activar el botón cuando ambos campos tengan texto
    function checkInputs() {
      if (emailInput.value.trim() !== "" && passwordInput.value.trim() !== "") {
        submitBtn.classList.add('active');
        submitBtn.removeAttribute('disabled');
      } else {
        submitBtn.classList.remove('active');
        submitBtn.setAttribute('disabled', 'true');
      }
    }

    emailInput.addEventListener('input', checkInputs);
    passwordInput.addEventListener('input', checkInputs);

    // Mostrar / ocultar contraseña
    togglePassword.addEventListener('click', function () {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      this.style.color = isPassword ? '#111' : '#999';
    });
  </script>

</body>
</html>
